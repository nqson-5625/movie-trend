apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  labels:
    app: kibana
    module: module-08
data:
  kibana.yml: |
    server.host: "0.0.0.0"
    server.port: 5601
    server.name: "movie-trend-kibana"
    server.shutdownTimeout: "30s"
    elasticsearch.hosts: ["http://elasticsearch-svc:9200"]
    elasticsearch.requestTimeout: 30000
    uiSettings:
      overrides:
        "dateFormat:tz": "UTC"
    telemetry.enabled: false
    newsfeed.enabled: false
    logging.root.level: info
